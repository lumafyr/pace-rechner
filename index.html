<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#521818">
<title>Pace-Rechner | Lumafyr</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#4d2020;background:#fff6f6}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #f0dada;padding:17px max(22px,calc((100vw - 950px)/2));display:flex;align-items:center;gap:12px}.brand{font-size:1.35rem;font-weight:800;letter-spacing:.05em}.mark{width:40px;height:40px}main{max-width:950px;margin:auto;padding:52px 22px 70px}.eyebrow{font-size:.8rem;letter-spacing:.16em;font-weight:750;color:#b43c3c;text-transform:uppercase}h1{font-size:clamp(2rem,5vw,3.7rem);line-height:1.08;letter-spacing:-.045em;margin:12px 0 16px}p{color:#855858;line-height:1.65}.lead{max-width:650px;font-size:1.1rem;margin-bottom:32px}.card{background:white;border:1px solid #f0dada;border-radius:22px;padding:clamp(20px,4vw,36px);box-shadow:0 12px 45px #0d3e6210}.mode{display:flex;gap:8px;padding:5px;background:#fbe8e8;border-radius:13px;margin-bottom:30px}.mode button{flex:1;border:0;border-radius:10px;padding:13px 8px;background:transparent;color:#864747;font-weight:750;cursor:pointer}.mode button.active{background:#922929;color:white;box-shadow:0 3px 9px #60181822}.field-title{font-weight:750;display:block;margin:22px 0 11px}.distances{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.distances button{border:1px solid #e9caca;background:#fff;color:#773535;padding:13px 5px;border-radius:11px;font-weight:700;cursor:pointer}.distances button.selected{background:#ffe1e1;border-color:#c13939;color:#9f2828}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.inputbox label{display:block;color:#906a6a;font-size:.82rem;margin-bottom:7px}.inputbox input,.custom input{width:100%;border:1px solid #e9caca;border-radius:11px;padding:14px;font:inherit;color:#642b2b;background:#fff;min-width:0}.inputbox input:focus,.custom input:focus{outline:3px solid #f3aaaa88;border-color:#c44a4a}.custom{display:flex;align-items:center;gap:12px;margin-top:13px}.custom input{max-width:170px}.custom span{color:#8f6666;font-size:.9rem}.result{margin-top:28px;background:#822525;border-radius:17px;color:#fff;padding:25px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.result small{display:block;color:#ffe0e0;margin-bottom:7px;font-weight:650}.result strong{font-size:clamp(1.5rem,4vw,2.3rem);font-variant-numeric:tabular-nums}.result strong span{font-size:.85rem;font-weight:500;color:#ffe0e0}.notice{min-height:24px;color:#a63232;font-size:.9rem;margin:12px 0 0}.footer{text-align:center;padding:25px;color:#a16e6e;font-size:.85rem}@media(max-width:600px){main{padding:34px 16px 45px}.distances{grid-template-columns:repeat(3,1fr)}.mode button{font-size:.87rem}.result{gap:14px;padding:20px}.result strong{font-size:1.55rem}.custom{flex-wrap:wrap}}@media(max-width:360px){.distances{grid-template-columns:repeat(2,1fr)}.result{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><svg class="mark" viewBox="0 0 48 48" aria-label="Lumafyr Leuchtturm" role="img"><circle cx="24" cy="24" r="22" fill="#ffeded" stroke="#bb3939" stroke-width="2"/><path d="M18 35 21 16h6l3 19M18 35h12M20 25h8M19 30h10M19 16h10l-2-5h-6z" fill="none" stroke="#912626" stroke-width="2.2" stroke-linejoin="round"/><path d="M7 39q5-4 10 0t10 0t14 0" fill="none" stroke="#d95d5d" stroke-width="2"/></svg><span class="brand">LUMAFYR</span></header>
<main><div class="eyebrow">Laufen · Tempo · Zeit</div><h1>Dein Tempo.<br>Dein Lauf.</h1><p class="lead">Berechne deine Pace, Zielzeit und Geschwindigkeit – unkompliziert, präzise und ohne Anmeldung.</p>
<section class="card" aria-label="Pace-Rechner">
<div class="mode" role="group" aria-label="Berechnungsart"><button id="modeTime" class="active" type="button" aria-pressed="true">Zielzeit → Pace</button><button id="modePace" type="button" aria-pressed="false">Pace → Zielzeit</button></div>
<label class="field-title">1. Wähle deine Distanz</label>
<div class="distances" id="distances"><button type="button" data-km="5">5 km</button><button type="button" data-km="10" class="selected">10 km</button><button type="button" data-km="16.09344">10 Meilen</button><button type="button" data-km="21.0975">Halbmarathon</button><button type="button" data-km="42.195">Marathon</button></div>
<div class="custom"><label for="customDistance">Eigene Distanz</label><input id="customDistance" type="number" min="0.001" max="10000" step="any" placeholder="z. B. 12,5" inputmode="decimal"><span>km</span></div>
<label class="field-title" id="timeLabel">2. Gib deine Zielzeit ein</label>
<div class="inputs"><div class="inputbox" id="hoursBox"><label for="hours">Stunden</label><input id="hours" type="number" min="0" max="999" step="1" value="0" inputmode="numeric"></div><div class="inputbox"><label for="minutes">Minuten</label><input id="minutes" type="number" min="0" max="59" step="1" value="50" inputmode="numeric"></div><div class="inputbox"><label for="seconds">Sekunden</label><input id="seconds" type="number" min="0" max="59" step="1" value="0" inputmode="numeric"></div></div>
<div class="result" aria-live="polite"><div><small id="primaryLabel">Deine Pace</small><strong id="primary">5:00 <span>min/km</span></strong></div><div><small id="secondaryLabel">Geschwindigkeit</small><strong id="secondary">12,00 <span>km/h</span></strong></div></div><p class="notice" id="notice" role="status"></p>
</section><div class="footer">Lumafyr · Pace-Rechner <span id="appVersion">1.1</span> · Entwickelt für alle, die gerne laufen.</div>
</main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let mode='time',distance=10;const buttons=[...document.querySelectorAll('[data-km]')];const fmtTime=sec=>{const s=Math.round(sec),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return(h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(r).padStart(2,'0')};const fmtPace=sec=>{const s=Math.round(sec);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};const n=id=>Number($(id).value);function calculate(){const h=n('hours'),m=n('minutes'),s=n('seconds'),valid=[h,m,s].every(Number.isFinite)&&[h,m,s].every(Number.isInteger)&&h>=0&&h<=999&&m>=0&&m<=59&&s>=0&&s<=59&&distance>0&&distance<=10000;const total=h*3600+m*60+s;if(!valid||total<=0){$('primary').textContent='–';$('secondary').textContent='–';$('notice').textContent='Bitte gültige, positive Werte eingeben (Minuten und Sekunden 0–59).';return}$('notice').textContent='';const pace=mode==='time'?total/distance:m*60+s;const speed=3600/pace;if(mode==='time'){$('primary').innerHTML=fmtPace(pace)+' <span>min/km</span>';$('secondary').innerHTML=speed.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' <span>km/h</span>'}else{$('primary').innerHTML=fmtTime(pace*distance)+' <span>h:min:s</span>';$('secondary').innerHTML=speed.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' <span>km/h</span>'}}function setMode(next){mode=next;$('modeTime').classList.toggle('active',mode==='time');$('modePace').classList.toggle('active',mode==='pace');$('modeTime').setAttribute('aria-pressed',mode==='time');$('modePace').setAttribute('aria-pressed',mode==='pace');$('hoursBox').hidden=mode==='pace';$('timeLabel').textContent=mode==='time'?'2. Gib deine Zielzeit ein':'2. Gib deine Pace pro Kilometer ein';$('primaryLabel').textContent=mode==='time'?'Deine Pace':'Deine Zielzeit';$('secondaryLabel').textContent='Geschwindigkeit';$('hours').value='0';$('minutes').value=mode==='time'?'50':'5';$('seconds').value='0';calculate()}$('modeTime').addEventListener('click',()=>setMode('time'));$('modePace').addEventListener('click',()=>setMode('pace'));buttons.forEach(b=>b.addEventListener('click',()=>{distance=Number(b.dataset.km);$('customDistance').value='';buttons.forEach(x=>x.classList.toggle('selected',x===b));calculate()}));$('customDistance').addEventListener('input',e=>{distance=Number(String(e.target.value).replace(',','.'));buttons.forEach(b=>b.classList.remove('selected'));calculate()});['hours','minutes','seconds'].forEach(id=>$(id).addEventListener('input',calculate));calculate()})();
</script>
</body></html>
